<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Enseignant - ESTF</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #1a236d;
            --secondary-color: #2c75bd;
            --light-blue: #e8f0fb;
            --mid-blue: #3a86d4;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a236d 0%, #2c75bd 60%, #a8c8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            max-width: 420px;
            width: 100%;
        }

        .login-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(26, 35, 109, 0.35);
            border-top: 4px solid var(--secondary-color);
        }

        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #1a236d 0%, #2c75bd 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon i {
            font-size: 2rem;
            color: white;
        }

        .login-title {
            color: var(--primary-color);
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: var(--secondary-color);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            color: var(--primary-color);
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--secondary-color);
        }

        .form-control {
            padding: 12px 14px 12px 42px;
            border: 1.5px solid #c5d8f0;
            border-radius: 10px;
            font-size: 0.95rem;
            transition: border-color 0.3s, box-shadow 0.3s;
            background: #f5f9ff;
            color: var(--primary-color);
        }

        .form-control::placeholder {
            color: #a0b4cc;
        }

        .form-control:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(44, 117, 189, 0.15);
            outline: none;
            background: #fff;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #a0b4cc;
            cursor: pointer;
            padding: 5px;
        }

        .password-toggle:hover {
            color: var(--secondary-color);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 0.85rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--primary-color);
        }

        .remember-me input {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--secondary-color);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #1a236d 0%, #2c75bd 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-size: 1rem;
            letter-spacing: 0.3px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(44, 117, 189, 0.4);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn-back {
            width: 100%;
            padding: 10px;
            background: transparent;
            color: var(--secondary-color);
            border: 1.5px solid #c5d8f0;
            border-radius: 10px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 12px;
            transition: background-color 0.2s, border-color 0.2s;
            font-size: 0.95rem;
        }

        .btn-back:hover {
            background: var(--light-blue);
            border-color: var(--secondary-color);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 16px 0;
            color: #7f98b8;
            font-size: 0.8rem;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #d8e5f6;
        }

        .google-login-wrap {
            display: flex;
            justify-content: center;
        }

        .google-login-wrap .google-disabled {
            font-size: 0.82rem;
            color: #7f98b8;
        }

        .alert {
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            display: none;
        }

        .alert-danger {
            background: #ddeeff;
            color: var(--primary-color);
            border: 1px solid #a0c4e8;
        }

        @media (max-width: 576px) {
            .login-card {
                padding: 30px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-icon">
                    <i class="fas fa-chalkboard-teacher"></i>
                </div>
                <h2 class="login-title">Connexion Enseignement</h2>
                <p class="login-subtitle">Gestion des Salles - ESTF</p>
            </div>

            <div id="errorAlert" class="alert alert-danger">
                <i class="fas fa-exclamation-circle me-2"></i>
                <span id="errorText"></span>
            </div>

            <form id="loginForm" method="post" action="/loginEnseignement">

                <!-- Champ Gmail -->
                <div class="form-group">
                    <label class="form-label" for="username">Adresse email</label>
                    <div class="input-wrapper">
                        <i class="input-icon fas fa-envelope"></i>
                        <input 
                            type="email" 
                            class="form-control" 
                            id="username" 
                            name="username"
                            placeholder="Votre adresse email"
                            required
                        >
                    </div>
                </div>

                <!-- Champ Mot de passe -->
                <div class="form-group">
                    <label class="form-label" for="password">Mot de passe</label>
                    <div class="input-wrapper">
                        <i class="input-icon fas fa-lock"></i>
                        <input 
                            type="password" 
                            class="form-control" 
                            id="password" 
                            name="password"
                            placeholder="Votre mot de passe"
                            required
                        >
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            <i class="fas fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>Se souvenir</span>
                    </label>
                    <a id="error" style="color:#2c75bd; font-size:0.85rem;"></a>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <i class="fas fa-sign-in-alt me-2"></i>
                    <span id="btnText">Se connecter</span>
                </button>

                <div class="divider">ou</div>

                <div class="google-login-wrap" id="googleLoginWrap">
                    <div id="googleLoginBtn"></div>
                </div>

                <a href="./index.html">
                    <button type="button" class="btn-back">
                        <i class="fas fa-arrow-left me-2"></i>
                        Retour à l'accueil
                    </button>
                </a>
            </form>
        </div>
    </div>

    <script>
        // Affiche le message d'erreur venant du serveur
        fetch('/loginEnseignement/error')
            .then(res => res.text())
            .then(msg => {
                if (msg) {
                    showError(msg);
                }
            });

        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.innerText = message;

            const alertEl = document.getElementById('errorAlert');
            document.getElementById('errorText').innerText = message;
            alertEl.style.display = 'block';
        }

        async function handleGoogleCredential(response) {
            if (!response || !response.credential) {
                showError('Connexion Gmail invalide.');
                return;
            }

            try {
                const res = await fetch('/loginEnseignement/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: response.credential })
                });

                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    showError(data.error || 'Connexion Gmail impossible.');
                    return;
                }

                window.location.href = data.redirect || '/private/Enseignement/accueilEnseignement.html';
            } catch (err) {
                showError('Erreur de connexion Gmail. Réessayez.');
            }
        }

        async function initGoogleLogin() {
            const wrap = document.getElementById('googleLoginWrap');
            const target = document.getElementById('googleLoginBtn');

            try {
                const configRes = await fetch('/loginEnseignement/google/config');
                const config = await configRes.json();

                if (!config.enabled || !config.clientId) {
                    wrap.innerHTML = '<span class="google-disabled">Connexion Gmail indisponible: configurez GOOGLE_CLIENT_ID dans .env puis redémarrez le serveur.</span>';
                    return;
                }

                const script = document.createElement('script');
                script.src = 'https://accounts.google.com/gsi/client';
                script.async = true;
                script.defer = true;
                script.onload = () => {
                    window.google.accounts.id.initialize({
                        client_id: config.clientId,
                        callback: handleGoogleCredential
                    });

                    window.google.accounts.id.renderButton(target, {
                        type: 'standard',
                        theme: 'outline',
                        size: 'large',
                        text: 'continue_with',
                        shape: 'pill',
                        width: 320
                    });
                };
                document.head.appendChild(script);
            } catch (err) {
                wrap.innerHTML = '<span class="google-disabled">Connexion Gmail indisponible pour le moment.</span>';
            }
        }

        function togglePassword() {
            const input = document.getElementById("password");
            const icon = document.getElementById("toggleIcon");
            if (input.type === "password") {
                input.type = "text";
                icon.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.replace("fa-eye-slash", "fa-eye");
            }
        }

        initGoogleLogin();
    </script>
</body>
</html>
